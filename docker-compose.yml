# =============================================================
# Sentinel AI — Docker Compose (hardened demo/deploy stack)
#
# * sentinel-ai : API + built dashboard (single container, non-root, read-only)
# * db          : PostgreSQL 16 — durable store for users, queries, feedback,
#                 verifications, transactions and the human review queue
# * redis       : Redis 7 — OTP / verification session store (fast, expiring)
#
# * Container root filesystem is READ-ONLY; only runtime-data volumes are writable.
# * NO secrets in this file. Secrets (auth secret, admin password, Twilio /
#   Razorpay keys, and the Postgres password) are injected at runtime from the
#   environment / a secret manager — e.g. `docker compose --env-file .env.prod up -d`
#   or your orchestrator's secret store.
#
#   docker compose up --build -d
#   open http://localhost:8100
# =============================================================

services:
  # ---------------------------------------------------------------- database
  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sentinel}"
      POSTGRES_USER: "${POSTGRES_USER:-sentinel}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD via your secret manager}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------- cache
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    # Persist AOF so in-flight OTP sessions survive a restart; still TTL-bounded.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------- app
  sentinel-ai:
    build: .
    image: sentinel-ai:latest
    container_name: sentinel-ai
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8100:8100"

    # Run hardened: non-root user, read-only root, no extra capabilities.
    user: "10001:10001"          # must match the appuser in the Dockerfile
    read_only: true              # container root fs is not writable
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    volumes:
      # Sole writable paths — persistent runtime data (feedback, verifications,
      # datasets). Never stored in the image. The Postgres-backed app does not
      # need the SQLite fallback, but it is kept for a graceful DB-less start.
      - sentinel_data:/app/backend/data
      - sentinel_db:/app/backend/database

    # Runtime secrets are NEVER inline here. Pass them from the environment /
    # secret manager. Override CORS origins and enable strict key checking:
    environment:
      SENTINEL_STRICT: "1"
      SENTINEL_CORS_ORIGINS: "${SENTINEL_CORS_ORIGINS:-http://localhost:8100}"
      # ---- persistence + cache wiring (points at the services above) ----
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD via your secret manager}@db:5432/${POSTGRES_DB:-sentinel}"
      REDIS_URL: "redis://redis:6379/0"
      # ---- secrets passed through from the host env / secret manager ----
      #   SENTINEL_AUTH_SECRET
      #   SENTINEL_ADMIN_PASSWORD
      #   SENTINEL_REDACT_OTP=1
      #   TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_PHONE_NUMBER
      #   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET
      SENTINEL_AUTH_SECRET: "${SENTINEL_AUTH_SECRET:?set SENTINEL_AUTH_SECRET via your secret manager}"
      SENTINEL_ADMIN_PASSWORD: "${SENTINEL_ADMIN_PASSWORD:?set SENTINEL_ADMIN_PASSWORD via your secret manager}"
      SENTINEL_REDACT_OTP: "${SENTINEL_REDACT_OTP:-1}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER:-}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"

volumes:
  sentinel_data:      # feedback, verifications, datasets (runtime)
  sentinel_db:        # SQLite fallback DB (unused when DATABASE_URL points at Postgres)
  pgdata:             # PostgreSQL data directory
  redis_data:         # Redis AOF/RDB data
